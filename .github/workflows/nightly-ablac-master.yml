name: Nightly ablac master

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ablac-master
  cancel-in-progress: false

jobs:
  master-downstream:
    name: Advisory downstream suite
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: abla-s3
    env:
      ABLAC: ${{ github.workspace }}/ablac/build/ablac
      ABLA_SYSROOT: ${{ github.workspace }}/ablac
      ABLA_NATIVE_JOBS: 2
      ABLA_CODEGEN_JOBS: 2
    steps:
      - name: Check out downstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: abla-s3
          persist-credentials: false
      - name: Check out ablac master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AndreBaltazar8/ablac
          ref: master
          path: ablac
          persist-credentials: false
      - name: Record the exact compiler revision
        id: compiler
        working-directory: ablac
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ablac master: $sha"
          printf 'Compiler: [%s](https://github.com/AndreBaltazar8/ablac/commit/%s)\n' "$sha" "$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/6510408d147d8c5e6d76043e899e9251756f6a75.tar.gz
      - name: Bootstrap the checked-out compiler from its pinned seed
        working-directory: ablac
        run: |
          nix-shell shell.nix --run 'make ablac && build/ablac --version'
          echo "$PWD/build" >> "$GITHUB_PATH"
      - name: Run unit and configuration tests
        run: nix-shell ../ablac/shell.nix --run 'make test-in-shell COMPILER=ablac'
      - name: Run real SeaweedFS compatibility tests
        run: |
          nix-shell ../ablac/shell.nix --run '
            make integration COMPILER=ablac INTEGRATION_SHELL="bash -c" S3_TEST_FILE_MIB=256
          '
      - name: Identify the compiler on failure
        if: failure()
        env:
          COMPILER_SHA: ${{ steps.compiler.outputs.sha }}
        run: |
          echo "::error title=Nightly ablac master failed::Compiler ${COMPILER_SHA:-checkout failed}. See the failed step above."
